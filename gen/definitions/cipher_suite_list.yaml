---
name: Cipher Suite List
rest_endpoint: /api/fmc_config/v1/domain/{DOMAIN_UUID}/object/ciphersuitelists
doc_category: Objects
attributes:
  - model_name: name
    type: String
    mandatory: true
    description: Name of the Cipher Suite List object.
    example: my_cipher_suite_list
    data_source_query: true
  - model_name: type
    type: String
    description: Type of the object; this value is always 'CipherSuiteList'.
    computed: true
  - model_name: type
    type: String
    description: Type of the object; this value is always 'CipherSuiteList'.
    value: CipherSuiteList
  - model_name: literals
    tf_name: cipher_suites
    type: Set
    description: Set of predefined cipher suites which are part of the cipher suite list object.
    mandatory: true
    attributes:
      - model_name: name
        type: String
        id: true
        mandatory: true
        description: Name of the cipher suite.
        example: TLS_RSA_WITH_AES_128_CBC_SHA
