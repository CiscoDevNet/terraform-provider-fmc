---
name: Distinguished Names
rest_endpoint: /api/fmc_config/v1/domain/{DOMAIN_UUID}/object/distinguishednames
doc_category: Objects
is_bulk: true
minimum_version: "7.4"
minimum_version_bulk_create: "999"
minimum_version_bulk_delete: "999"
attributes:
  - model_name: items
    type: Map
    description: >-
      Map of Distinguished Names. The key of the map is the name of the individual Distinguished Name.
    map_key_example: my_distinguished_names
    mandatory: true
    attributes:
      - model_name: id
        type: String
        resource_id: true
        description: Id of the Distinguished Name object.
        exclude_example: true
        exclude_test: true
      - model_name: type
        type: String
        description: Type of the object; this value is always 'DistinguishedName'.
        computed: true
      - model_name: type
        type: String
        description: Type of the object; this value is always 'DistinguishedName'.
        value: DistinguishedName
      - model_name: dn
        tf_name: distinguished_name
        type: String
        mandatory: true
        description: >-
          The value of the distinguished name, provided as comma-separated attribute-value pairs (for example `CN=example.com,OU=IT,O=Example,C=US`).
        example: "C=US,CN=example.com,O=Example,OU=IT"
