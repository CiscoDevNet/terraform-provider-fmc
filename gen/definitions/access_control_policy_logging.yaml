---
name: Access Control Policy Logging
rest_endpoint: /api/fmc_config/v1/domain/{DOMAIN_UUID}/policy/accesspolicies/%v/loggingsettings
doc_category: Policies
no_data_source: true
res_description: This resource manages Access Control Policy Logging Settings.
put_create: true
retrieve_id: true
put_delete: true
attributes:
  - model_name: access_control_policy_id
    type: String
    description: Id of the Access Control Policy.
    reference: true
    example: 76d24097-41c4-4558-a4d0-a8c07ac08470
    test_value: fmc_access_control_policy.test.id
  - model_name: type
    type: String
    description: Type of the object; this value is always 'LoggingSetting'.
    computed: true

  # Default syslog settings
  - model_name: id
    data_path: [syslogConfig]
    tf_name: syslog_alert_id
    type: String
    description: Id of the default syslog alert used for connection events of this Access Control Policy.
    example: 35e197ca-33a8-11ef-b2d1-d98ae17766e7
    exclude_test: true
  - model_name: syslogConfigFromPlatformSetting
    tf_name: syslog_use_platform_settings
    type: Bool
    description: Send syslog messages using the syslog configuration from FTD Platform Settings.
    example: true
  - model_name: severityForPlatformSettingSyslogConfig
    tf_name: syslog_platform_settings_severity
    type: String
    description: Severity of syslog messages sent using the syslog configuration from FTD Platform Settings.
    enum_values: [ALERT, CRIT, DEBUG, EMERG, ERR, INFO, NOTICE, WARNING]
    example: CRIT

  # IPS events
  - model_name: enableipsSyslog
    tf_name: ips_events_send_syslog
    type: Bool
    description: Send syslog messages for IPS events.
    example: true
  - model_name: ipsSyslogSeverity
    tf_name: ips_events_syslog_severity
    type: String
    description: Severity of syslog messages for IPS events.
    enum_values: [ALERT, CRIT, DEBUG, EMERG, ERR, INFO, NOTICE, WARNING]
    example: ERR
  - model_name: id
    data_path: [ipsSyslogConfig]
    tf_name: ips_events_syslog_alert_id
    type: String
    description: Id of the syslog alert used for IPS events. If not set, the default syslog alert (`syslog_alert_id`) is used.
    example: 35e197ca-33a8-11ef-b2d1-d98ae17766e7
    exclude_test: true

  # File and malware events
  - model_name: enableFileAndMalwareSyslog
    tf_name: file_and_malware_events_send_syslog
    type: Bool
    description: Send syslog messages for file and malware events.
    example: true
  - model_name: fileAndMalwareSyslogSeverity
    tf_name: file_and_malware_events_syslog_severity
    type: String
    description: Severity of syslog messages for file and malware events.
    enum_values: [ALERT, CRIT, DEBUG, EMERG, ERR, INFO, NOTICE, WARNING]
    example: ALERT
  - model_name: id
    data_path: [fileAndMalwareSyslogConfig]
    tf_name: file_and_malware_events_syslog_alert_id
    type: String
    description: Id of the syslog alert used for file and malware events. If not set, the default syslog alert (`syslog_alert_id`) is used.
    example: 35e197ca-33a8-11ef-b2d1-d98ae17766e7
    exclude_test: true

test_prerequisites: |-
  resource "fmc_access_control_policy" "test" {
    name           = "acp_logging"
    default_action = "BLOCK"
  }
