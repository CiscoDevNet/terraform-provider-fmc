    map_key_example: Search Engines and Portals
    mandatory: true
    attributes:
      - model_name: id
        type: String
        resource_id: true
        description: Id of the URL Category.
        exclude_example: true
        exclude_test: true
      - model_name: type
        type: String
        description: Type of the object; this value is always 'URLCategory'.
        computed: true
